[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditflow"
version = "0.1.0"
description = "AuditFlow AI: privacy-preserving multi-agent working capital optimization for SMEs"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "web3>=7.0",
    "eth-account>=0.13",
    "anthropic>=0.40",
    "streamlit>=1.35",
    "pytest>=8.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["engine*", "services*", "experiments*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
