[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# FISCO BCOS 3.x local chain (Web3 RPC on node0): pre-Shanghai opcodes to be safe
[profile.fisco]
evm_version = "paris"

[rpc_endpoints]
base_sepolia = "${RPC_URL}"
